name: Verify public reference
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.5'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Verify receipt-derived presentation and blank contract
        run: python docs/presentation/build.py --check
      - name: Reproduce retained challenge from public history
        run: tl challenge verify data/challenge/first --json
      - name: Reproduce the rc5 challenge from public history
        run: tl challenge verify data/challenge/rc5 --json
      - name: Verify the refreshed challenge
        run: tl challenge verify data/challenge/rc6 --json
      - name: Copy the fixture for the evaluator's working attempt
        run: python -c "import shutil; shutil.copytree('data/challenge/rc6', 'data/challenge/ci-attempt')"
      - name: Check out the retained challenge executable
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 933cd94525e20d651c81b192b36cd06d9a552ef2
          path: .retained-rc6
          fetch-depth: 0
      - name: Grade the visible reference answer with its original executable
        working-directory: .retained-rc6
        run: python -m tl challenge grade ../data/challenge/ci-attempt --answer ../data/challenge/ci-attempt/expected.json --output ../data/score/ci-reference --json
      - name: Preserve the retained release fixture
        run: git diff --exit-code -- data/challenge/rc5 data/challenge/rc6
      - name: Reproduce the recording's original number
        run: tl --db data/demo/recorded/world.duckdb --artifact-root data/demo/recorded receipt mr-a57e47711e3b91ca3ef32885f5737e63 --json
      - name: Verify the saved cloud observation seal without the large download
        run: tl --artifact-root evidence/bigquery/verification receipt mr-3d66e52715aa14f49be17975a4c4c26a --json
      - name: Rehearse the reporting-learning loop offline
        run: tl learning walkthrough --directory data/learning-walkthrough/ci --json
      - name: Replay the recorded walkthrough from public history
        run: tl learning replay-walkthrough data/learning-walkthrough/recorded --json
      - name: Preserve the retained walkthrough
        run: git diff --exit-code -- data/learning-walkthrough/recorded
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan complete history with pinned gitleaks
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --log-opts=--all
