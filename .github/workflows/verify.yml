name: Verify public reference
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-reference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.5'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Reproduce retained challenge from public history
        run: tl challenge verify data/challenge/first --json
      - name: Verify the refreshed challenge
        run: tl challenge verify data/challenge/rc5 --json
      - name: Grade the visible reference answer
        run: tl challenge grade data/challenge/rc5 --answer data/challenge/rc5/expected.json --output data/score/ci-reference --json
      - name: Reproduce the recording's original number
        run: tl --db data/demo/recorded/world.duckdb --artifact-root data/demo/recorded receipt mr-a57e47711e3b91ca3ef32885f5737e63 --json
      - name: Verify the saved cloud observation seal without the large download
        run: tl --artifact-root evidence/bigquery/verification receipt mr-3d66e52715aa14f49be17975a4c4c26a --json
  secrets:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan complete history with pinned gitleaks
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --log-opts=--all
