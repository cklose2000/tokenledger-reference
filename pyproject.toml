[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenledger"
version = "0.2.0"
description = "Synthetic reporting from a governed activity spine"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "click==8.1.8",
  "duckdb==1.5.5",
  "numpy==1.26.4",
  "pyarrow==18.1.0",
  "PyYAML==6.0.2",
  "pytz==2025.2",
  "sqlglot==30.18.0",
  "tzdata==2025.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
bigquery = ["Jinja2==3.1.6", "google-cloud-bigquery==3.45.0", "google-cloud-bigquery-storage==2.41.0", "db-dtypes==1.7.1"]

[project.scripts]
tl = "tl.cli:main"

[tool.setuptools.packages.find]
include = ["tl*"]

[tool.setuptools.package-data]
"tl.stream" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
