name: usage_observed
version: v1
customer_required: true
features:
  observation_id: {type: string}
  source: {type: string}
  scope_id: {type: string}
  model: {type: string, nullable: true}
  token_kind: {type: string, enum: [total, input, output, cache_read, cache_write, reasoning_output]}
  quantity: {type: integer, min: 0, nullable: true}
  temporality: {type: string, enum: [delta, cumulative, interval_total]}
  interval_start: {type: timestamp}
  interval_end: {type: timestamp}
  revision: {type: integer, min: 0}
  supersedes: {type: string, nullable: true}
  evidence_sha256: {type: sha256}
