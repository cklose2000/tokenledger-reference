name: consumption_nrr
version: v3
grain: as-of date and fixed-parent cohort lens
dimensions:
- month
- lens
allowed_cuts: []
default_cuts: []
inclusions:
- usage and commit-funded usage
- zero-spend cohort members
- ultimate-parent mapping at the same cutoffs for both windows
exclusions:
- new customers outside base cohort
- one-time credits
- unused-commit expiry
- subscriptions except labeled inclusive lens
known_gaming_vectors:
- cohort floor selection
- survivorship bias
- acquisition mapping asymmetry
- annualized tiny denominators
- subscription mix
disclosure_note: Opt-in floor-change demonstration. v3 changes the headline base_t12m
  floor from USD 10,000 to USD 100,000. All other lenses and v2 availability policy
  remain identical. Publish the v2-to-v3 bridge before selecting this headline. This
  is not approval to publish a changed definition.
lenses:
- lens: base_t12m
  months: 12
  floor_usd: 100000
  annualization: 1
  include_subscription: false
- lens: floor_100k
  months: 12
  floor_usd: 100000
  annualization: 1
  include_subscription: false
- lens: t3m_annualized
  months: 3
  floor_usd: 10000
  annualization: 4
  include_subscription: false
- lens: subscription_inclusive
  months: 12
  floor_usd: 10000
  annualization: 1
  include_subscription: true
formula:
  prose: Same-parent cohort current-window consumption revenue divided by base-window
    revenue. Current = base + expansion - contraction - churn, in cents.
  sql: tl/metrics/sql/consumption_nrr/v2.sql
recognition_policy: definitions/policies/recognition/v1.yaml
allocation_version: v1
rounding: Monetary source and allocations in integer cents; USD output has 2 decimals;
  ratios round to 12 decimals.
null_behavior: NRR, expansion, contraction, churn shares and cohort revenue coverage
  are null for insufficient_history and undefined_zero_base. Observed amounts and
  counts remain diagnostic.
units: Money fields ending _cents are rendered as _usd. Token unit prices are USD
  per million tokens; ratios are fractions, not percent; capacity is MW.
definition_change: Create a new version path and a restatement/disclosure bridge;
  do not edit released v1.
availability_policy:
  required_history: first observed month <= start of the base window; source completeness
    is a separate control
  ratios: all five ratios null unless full history and nonzero cohort base
  diagnostics: amounts and counts describe only the observed snapshot, even when unavailable
decision: docs/decisions/ADR-012-restatement-and-nrr-availability.md
