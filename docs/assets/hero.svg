<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d">
  <title id="t">What tokenledger does</title>
  <desc id="d">Business events flow into one append-only activity stream. Versioned definitions turn the stream into a reported number. Every number carries a receipt, so the original result can be reproduced after late evidence arrives.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4a5a68"/></marker>
  </defs>
  <rect width="1000" height="330" fill="#ffffff"/>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" fill="#1f2a33">

    <!-- Box 1: events -->
    <rect x="30" y="70" width="250" height="110" rx="10" fill="#f3f5f7" stroke="#8a97a3" stroke-width="2"/>
    <text x="155" y="112" font-size="24" font-weight="700" text-anchor="middle">Business events</text>
    <text x="155" y="148" font-size="18" text-anchor="middle" fill="#4a5a68">tokens · invoices · seats</text>

    <!-- Arrow 1 -->
    <path d="M282 125H358" stroke="#4a5a68" stroke-width="3" marker-end="url(#a)"/>

    <!-- Box 2: stream -->
    <rect x="365" y="70" width="270" height="110" rx="10" fill="#e6f3ec" stroke="#2c7a55" stroke-width="2"/>
    <text x="500" y="112" font-size="24" font-weight="700" text-anchor="middle">One activity stream</text>
    <text x="500" y="148" font-size="18" text-anchor="middle" fill="#4a5a68">append-only, never edited</text>

    <!-- Arrow 2, labeled -->
    <path d="M637 125H713" stroke="#4a5a68" stroke-width="3" marker-end="url(#a)"/>
    <text x="675" y="58" font-size="16" text-anchor="middle" fill="#4a5a68">versioned definition</text>

    <!-- Box 3: number -->
    <rect x="720" y="70" width="250" height="110" rx="10" fill="#e8eefa" stroke="#3a67ad" stroke-width="2"/>
    <text x="845" y="112" font-size="24" font-weight="700" text-anchor="middle">A reported number</text>
    <text x="845" y="148" font-size="18" text-anchor="middle" fill="#4a5a68">July revenue per Mtok</text>

    <!-- Receipt line -->
    <path d="M845 182V236" stroke="#3a67ad" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#a)"/>
    <rect x="365" y="240" width="605" height="60" rx="10" fill="#ffffff" stroke="#3a67ad" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="667" y="278" font-size="20" font-weight="600" text-anchor="middle">+ a receipt: reproduce the original after a late invoice</text>
  </g>
</svg>
